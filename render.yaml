services:
  - type: static_site
    name: cv
    repo: https://github.com/grytchyn/cv
    branch: main
    buildCommand: npm install && npm run build
    publishPath: docs
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

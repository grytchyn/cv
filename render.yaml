services:
  - type: web
    name: cv
    repo: https://github.com/grytchyn/cv
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
